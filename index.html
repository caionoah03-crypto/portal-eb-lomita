 const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];
 const path='comando/'+crypto.randomUUID()+'.'+ext;
 const response=await fetch(base+'/storage/v1/object/fotos-comando/'+path,{method:'POST',headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+session.access_token,'Content-Type':file.type,'x-upsert':'false'},body:file});
 if(!response.ok){let msg='Erro ao enviar fotografia';try{const d=await response.json();msg=d.message||d.error||msg}catch(e){}throw Error(msg)}
 return base+'/storage/v1/object/public/fotos-comando/'+path;
}

const base=String(cfg.supabaseUrl||'').replace(/\/$/,'');
const publicHeaders=()=>({'apikey':cfg.supabaseAnonKey,'Content-Type':'application/json'});
async function api(path,opts={},protectedCall=false){
  const headers={...publicHeaders(),...opts.headers};
  if(protectedCall){if(!session?.access_token)throw Error('Sessão encerrada. Faça login novamente.');headers.Authorization='Bearer '+session.access_token}
  else headers.Authorization='Bearer '+cfg.supabaseAnonKey;
  const response=await fetch(base+path,{...opts,headers});
  if(!response.ok){let msg='Erro HTTP '+response.status;try{const d=await response.json();msg=d.message||d.msg||d.error_description||d.error||msg}catch(e){}throw Error(msg)}
  if(response.status===204)return null;
  const t=await response.text();return t?JSON.parse(t):null;
}

async function restoreSession(){
  if(!cloudMode)return;
  try{
    const saved=JSON.parse(sessionStorage.getItem('lomita_session')||'null');
    if(!saved?.token?.access_token)return;
    // tokens expiram; não tentar manter sessão sem validação
    if(Date.now()-saved.at>Math.max(0,(saved.token.expires_in||3600)-90)*1000){sessionStorage.removeItem('lomita_session');return}
    session=saved.token;
    const rows=await api('/rest/v1/portal_admins?select=role&user_id=eq.'+encodeURIComponent(session.user.id),{},true);
    if(rows?.length&&['general_federal','alto_comando','comando_norte'].includes(rows[0].role)){isAdmin=true;adminRole=rows[0].role;adminEmail=session.user.email||''}else{session=null;sessionStorage.removeItem('lomita_session')}

}

// Indicadores calculados a partir dos dados públicos já carregados.
function indicadoresEfetivo(){
 const total=efetivoRecords.length;
 const contagem=s=>efetivoRecords.filter(p=>situacaoAtual(p)===s).length;
 const dados=[['TOTAL',total],['ATIVOS',contagem('Ativo')],['AFASTADOS',contagem('Afastado')],['FÉRIAS',contagem('Férias')]];
 return `<div class="efetivo-indicadores">${dados.map(([rotulo,valor])=>`<div class="efetivo-indicador"><span>${rotulo}</span><strong>${valor}</strong></div>`).join('')}</div>`;
}
function distribuicaoPatentes(){
 const grupos=new Map();
 for(const p of efetivoRecords){const chave=patenteNormalizada(p.patente);if(!grupos.has(chave))grupos.set(chave,{patente:p.patente,total:0});grupos.get(chave).total++}
 const lista=[...grupos.values()].sort((a,b)=>ordemPatente(a.patente)-ordemPatente(b.patente)||a.patente.localeCompare(b.patente,'pt-BR'));
 return `<section class="panel" style="margin-top:16px"><h3>DISTRIBUIÇÃO POR PATENTE</h3>${lista.length?`<div class="efetivo-distribuicao">${lista.map(g=>`<div class="efetivo-grupo"><span>${esc(g.patente)}</span><strong>${g.total}</strong></div>`).join('')}</div>`:'<p class="muted">Nenhuma patente cadastrada.</p>'}</section>`;
}
function exportarEfetivoCSV(){
 if(!efetivoLoaded||efetivoError)return;
 const linhas=[['Nome militar','Patente','Função','Situação'],...efetivoSorted().map(p=>[p.nome_militar,p.patente,p.cargo||'',detalheFerias(p)])];
 const celula=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/, "'" ).replace(/"/g,'""')+'"';
 const csv='\uFEFF'+linhas.map(l=>l.map(celula).join(';')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
 const a=document.createElement('a');a.href=url;a.download='efetivo-setor-norte.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function loadEfetivo(){
 if(!cloudMode)return;
 try{
  const rows=await api('/rest/v1/efetivo_norte?select=id,nome_militar,patente,cargo,situacao,ferias_inicio,ferias_dias&order=nome_militar.asc',{},Boolean(isAdmin&&session?.access_token));
  efetivoRecords=Array.isArray(rows)?rows:[];efetivoError='';efetivoLoaded=true;
 }catch(e){efetivoError='Não foi possível carregar o efetivo: '+e.message;efetivoLoaded=false}
 const p=decodeURIComponent(location.hash.slice(1));
 if(p==='efetivo'){document.getElementById('app').innerHTML=efetivoPublicPage();atualizarFiltrosEfetivo();}
 else if(p==='admin'&&(adminRole==='comando_norte'||adminTab==='efetivo_norte'))document.getElementById('app').innerHTML=adminPage();
}
function editEfetivo(id){efetivoEditId=id;render()}
async function saveEfetivo(ev){
 ev.preventDefault();if(!isAdmin||!cloudMode)return;
 const f=ev.target,fd=new FormData(f),data={nome_militar:String(fd.get('nome_militar')||'').trim(),patente:String(fd.get('patente')||'').trim(),cargo:String(fd.get('cargo')||'').trim(),situacao:String(fd.get('situacao')||'')};
 if(!data.nome_militar||!data.patente||!efetivoSituacoes.includes(data.situacao))return alert('Confira os campos.');
 if(data.situacao==='Férias'){data.ferias_inicio=String(fd.get('ferias_inicio')||'');data.ferias_dias=Number(fd.get('ferias_dias'));if(!/^\d{4}-\d{2}-\d{2}$/.test(data.ferias_inicio)||!Number.isInteger(data.ferias_dias)||data.ferias_dias<1||data.ferias_dias>365)return alert('Informe a data de início e a quantidade de dias (1 a 365).')}else{data.ferias_inicio=null;data.ferias_dias=null}
 const submit=f.querySelector('[type=submit]');submit.disabled=true;
 try{
  if(efetivoEditId)await api('/rest/v1/efetivo_norte?id=eq.'+encodeURIComponent(efetivoEditId),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(data)},true);
  else await api('/rest/v1/efetivo_norte',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(data)},true);
  efetivoEditId=null;await loadEfetivo();alert('Registro salvo com sucesso.');
 }catch(e){alert('Não foi possível salvar: '+e.message)}finally{submit.disabled=false}
}
async function deleteEfetivo(id){
 if(!isAdmin||!cloudMode||!confirm('Excluir este militar do efetivo?'))return;
 try{await api('/rest/v1/efetivo_norte?id=eq.'+encodeURIComponent(id),{method:'DELETE'},true);efetivoEditId=null;await loadEfetivo()}
 catch(e){alert('Não foi possível excluir: '+e.message)}
}

const cronogramaFixo=[
 ['11:00','Roubo ao Arsenal — Exército'],
 ['11:30','Entrega de Drone'],
 ['13:00','Roubo ao Arsenal — Exército'],
 ['14:30','Entrega de Drone'],

];
function horarioBrasilia(){
 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
 const get=t=>Number(parts.find(p=>p.type===t).value);
 return get('hour')*3600+get('minute')*60+get('second');
}
function tempoRestante(segundos){
 const h=Math.floor(segundos/3600),m=Math.floor((segundos%3600)/60),s=segundos%60;
 return (h?`${h}h `:'')+`${m}min ${String(s).padStart(2,'0')}s`;
}
function cronogramaDinamico(){
 const agora=horarioBrasilia();
 const agenda=cronogramaFixo.map(([hora,nome])=>({hora,nome,inicio:(Number(hora.slice(0,2))*60+Number(hora.slice(3)))*60}));
 const ativo=agenda.find(e=>agora>=e.inicio&&agora<e.inicio+900);
 const proximo=agenda.find(e=>e.inicio>agora)||agenda[0];
 const amanha=proximo.inicio<=agora;
 const falta=proximo.inicio+(amanha?86400:0)-agora;
 const card=ativo?`<section class="panel" style="border:1px solid #d8b46b;margin-bottom:16px"><h3>🟢 EVENTO EM ANDAMENTO</h3><h2>${esc(ativo.nome)}</h2><p><b>${ativo.hora}–${String(Number(ativo.hora.slice(0,2))+Math.floor((Number(ativo.hora.slice(3))+15)/60)).padStart(2,'0')}:${String((Number(ativo.hora.slice(3))+15)%60).padStart(2,'0')}</b> · Termina em ${tempoRestante(ativo.inicio+900-agora)}</p></section>`:'';
 const linhas=agenda.map(e=>{
 const passou=agora>=e.inicio+900,emCurso=agora>=e.inicio&&agora<e.inicio+900;
 const fim=e.inicio+900;
 const fimHora=String(Math.floor(fim/3600)).padStart(2,'0')+':'+String(Math.floor((fim%3600)/60)).padStart(2,'0');
 return `<div class="rule" style="display:flex;gap:12px;justify-content:space-between;align-items:center;opacity:${passou?.6:1}"><div><b>${esc(e.nome)}</b><p style="margin:2px 0">${e.hora}–${fimHora}</p></div><small>${emCurso?'EM ANDAMENTO':passou?'ENCERRADO':'AGENDADO'}</small></div>`;
 }).join('');
 return `<section class="panel" style="margin-bottom:16px"><h3>⏳ PRÓXIMO EVENTO ${amanha?'— AMANHÃ':'— HOJE'}</h3><h2>${esc(proximo.nome)}</h2><p><b>${proximo.hora}</b> · Começa em <strong>${tempoRestante(falta)}</strong></p><small>Horário de Brasília (UTC−3) · Programação diária · Duração: 15 minutos</small></section>${card}<section class="panel"><h3>PROGRAMAÇÃO DIÁRIA</h3>${linhas}</section>`;
}

content=function(p){
 if(p!=='cronograma')return conteudoAntesCronograma(p);
 return heading('CRONOGRAMA','Eventos diários do Exército de Lomita')+wrap(`<div id="cronograma-automatico">${cronogramaDinamico()}</div><section class="panel" style="margin-top:16px"><h3>EVENTOS EXTRAORDINÁRIOS / COMUNICADOS PELO COMANDO</h3>${eventsMarkup()}</section>`);

let recCategoria='Todas',recAtual=null,recMostrar=false,recHistorico=[];
function recSorteio(){
 let disponiveis=perguntasRecrutador.map((q,i)=>({q,i})).filter(x=>recCategoria==='Todas'||x.q[0]===recCategoria);
 let semRepetir=disponiveis.filter(x=>!recHistorico.includes(x.i));
 if(!semRepetir.length){recHistorico=[];semRepetir=disponiveis;}
 if(!semRepetir.length)return;
 const escolha=semRepetir[Math.floor(Math.random()*semRepetir.length)];
 recAtual=escolha.i;recHistorico.push(recAtual);recMostrar=false;recAtualizar();
}
function recEscolherCategoria(v){recCategoria=v;recHistorico=[];recAtual=null;recMostrar=false;recSorteio();}
function recAtualizar(){const area=document.getElementById('rec-pergunta');if(!area||recAtual===null)return;
 const q=perguntasRecrutador[recAtual];const total=perguntasRecrutador.filter(x=>recCategoria==='Todas'||x[0]===recCategoria).length;
 area.innerHTML=`<div class="rec-muted">${esc(q[0])} · ${total} perguntas nesta seleção</div><p class="rec-question">${esc(q[1])}</p>${recMostrar?`<div class="rec-answer"><b>RESPOSTA DE REFERÊNCIA</b><p>${esc(q[2])}</p></div>`:''}<div class="rec-actions"><button type="button" onclick="recMostrar=!recMostrar;recAtualizar()">${recMostrar?'OCULTAR RESPOSTA':'VER RESPOSTA'}</button><button type="button" onclick="recSorteio()">↻ SORTEAR OUTRA PERGUNTA</button></div>`;
}
function recCopiar(btn){const msg=btn.parentElement.querySelector('.rec-texto').textContent;const success=()=>{btn.textContent='✓ COPIADO';setTimeout(()=>{if(btn.isConnected)btn.textContent='COPIAR TEXTO'},1800)};
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(msg).then(success).catch(()=>window.prompt('Copie o texto:',msg))}else window.prompt('Copie o texto:',msg);
}

async function premiumSaveHonor(ev){ev.preventDefault();if(!isAdmin||!['general_federal','alto_comando'].includes(adminRole))return alert('Acesso do Alto Comando necessário.');const f=ev.target;const image=f.image.value.trim();if(image&&!/^https:\/\//i.test(image))return alert('Use um endereço de imagem HTTPS.');const record={name:f.name.value.trim(),category:f.category.value,rank:f.rank.value.trim(),date:f.date.value,image,description:f.description.value.trim()};if(!record.name||!record.description)return alert('Preencha nome e motivo.');const rows=premiumHonorRecords().map(x=>({...x}));if(premiumHonorEdit>=0)rows[premiumHonorEdit]=record;else rows.unshift(record);const before=structuredClone(state.sections||{});state.sections={...before,__honra:rows};const ok=await saveState();if(!ok)state.sections=before;else premiumHonorEdit=-1;render();if(ok)alert('Mural de Honra atualizado.');}

function premiumRefreshClocks(){const p=decodeURIComponent(location.hash.slice(1))||'inicio';if(p==='inicio'||p==='cronograma'){const container=document.getElementById('app');const countdown=container?.querySelector('[data-next-countdown]');if(!countdown)return;const d=premiumAgendaState();const displayed=container.querySelector('.premium-banner h2')?.textContent;if(displayed!==d.next.nome||countdown.textContent!==tempoRestante(d.remaining)&&d.remaining>=0){if(displayed!==d.next.nome){render();return}countdown.textContent=tempoRestante(d.remaining)}if(p==='cronograma'){const timeline=container.querySelector('.premium-timeline');if(timeline){for(const el of timeline.children){const hh=el.querySelector('strong')?.textContent;const e=d.agenda.find(x=>x.hora===hh);if(!e)continue;const current=d.current===e,passed=d.now>=e.start+900,next=d.next===e;el.classList.toggle('is-current',current);el.classList.toggle('is-past',passed);el.classList.toggle('is-next',next);const tag=el.querySelector('.premium-tag');if(tag)tag.textContent=current?'EM ANDAMENTO':passed?'ENCERRADO':next?'PRÓXIMO':'AGENDADO'}}}}}
setInterval(premiumRefreshClocks,1000);
