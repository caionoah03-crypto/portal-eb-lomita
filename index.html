</style><script src="config.js"></script></head><body><div class="shell"><header class="top"><div class="crest" aria-hidden="true">★</div><div class="brand"><div class="eyebrow">ONESTATE RP</div><strong>EXÉRCITO DE LOMITA</strong><small>PORTAL INSTITUCIONAL · SETOR NORTE</small></div><div class="header-status"><span class="status-dot"></span> PORTAL DO SETOR NORTE</div><button class="mobiletoggle" id="mobiletoggle" aria-label="Abrir menu">☰</button></header><div class="bodygrid"><aside class="sidebar" id="sidebar"><div class="sideitems" id="sidemenu"></div><div class="sidefoot">EXÉRCITO DE LOMITA<br><b>DISCIPLINA • HONRA</b><br>COMPROMISSO</div></aside><div class="content"><div id="app"></div><footer class="footer">EXÉRCITO DE LOMITA · SETOR NORTE · PORTAL DE ROLEPLAY NO ONESTATE</footer></div></div></div><script>

const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const go=p=>{location.hash=p;render();window.scrollTo(0,0);$('#sidebar').classList.remove('open')};const button=(p,title,desc,icon)=>`<button class="tile" onclick="go('${p}')"><span class="symbol">${icon}</span><strong>${title}</strong><small>${desc}</small></button>`;const card=(name,rank,job,res,photo=false)=>`<article class="infocard"><div class="avatar">${photo?'FOTOGRAFIA DO PERSONAGEM':'IMAGEM A SER INSERIDA'}</div><h3>${name}</h3><div class="rank">${rank}</div><p><b>Função:</b> ${job}</p><p><b>Responsabilidade:</b> ${res}</p></article>`;const block=(title,body)=>`<div class="rule"><b>${title}</b><p>${body}</p></div>`;const heading=(title,sub)=>`<div class="pagehead"><span class="tag">EXÉRCITO DE LOMITA · SETOR NORTE</span><h1>${title}</h1><p>${sub}</p></div>`;const wrap=(content)=>`<div class="inner">${content}</div>`;
const rp=[['01 — METAGAMING (MG)','Utilizar informações de fora do jogo para beneficiar o personagem. Exemplo: descobrir pelo Discord a localização de um suspeito.'],['02 — NONRP POWER (NP)','Executar ações que ignoram limites físicos ou possibilidades do personagem. Exemplo: continuar normalmente após acidente grave.'],['03 — RECUSA DE RP','Abandonar intencionalmente uma situação de RP para fugir das consequências.'],['04 — NON ROLEPLAY (NRP)','Agir de forma incoerente com a situação interpretada.'],['05 — DEATHMATCH (DM)','Atacar ou matar sem justificativa válida dentro do RP.'],['06 — DEATHMATCH AUTO (DMAUTO)','Danificar ou destruir veículos sem justificativa válida de RP.'],['07 — REPEAT KILL (RK)','Respeitar as consequências da morte, o prazo aplicável e o encerramento da situação de RP.'],['08 — DRIVEBY (DB)','Não utilizar viaturas para atropelar ou atacar indevidamente jogadores.'],['09 — ÁREAS PROTEGIDAS','Respeitar as restrições de combate de cada área protegida.'],['10 — INTERPRETAÇÃO','Interpretar ações com coerência e utilizar apenas os comandos disponíveis no jogo.']];

function content(p){switch(p){case'inicio':return `<section class="hero"><div class="heroInner"><span class="tag">PORTAL INSTITUCIONAL · ONESTATE RP</span><h1>FORÇA.<br>DISCIPLINA.<br><em>UNIÃO.</em></h1><p>Bem-vindo ao portal do Exército de Lomita. Acesse informações do comando, formação militar, comunicados e atividades do Setor Norte.</p><a class="goldbtn" href="#central" onclick="go('central');return false">EXPLORAR O PORTAL <span>➜</span></a></div></section>${wrap(`<div class="quick">${button('estudos','Material de Estudo','Guias e conteúdos','▤')}${button('central','Central do Recruta','Formação e regras','♜')}${button('comando','Organograma','Comando e hierarquia','♛')}${button('cronograma','Cronograma','Atividades militares','◷')}</div><div class="bottomgrid"><section class="panel"><h3>ÚLTIMAS ATUALIZAÇÕES</h3><div class="newsitem"><span class="newsicon">▤</span><div><b>Portal em desenvolvimento</b><p>Prévia visual do novo site institucional</p></div></div><div class="newsitem"><span class="newsicon">♜</span><div><b>Central do Recruta</b><p>Materiais e regras disponíveis no portal</p></div></div><div class="newsitem"><span class="newsicon">◷</span><div><b>Cronograma</b><p>Área reservada à programação oficial</p></div></div><button class="goldbtn" onclick="go('comunicados')">VER COMUNICADOS <span>➜</span></button></section><section class="panel feature"><div><h3>SETOR NORTE</h3><p>Disciplina · Honra · Compromisso</p><button class="goldbtn" onclick="go('comando')">CONHECER COMANDO <span>➜</span></button></div></section></div>`)}`;

async function uploadCommanderPhoto(file){
 if(!cloudMode||!isAdmin||!session?.access_token)throw Error('Faça login no painel conectado para enviar fotos.');
 if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Use JPG, PNG ou WebP.');
 if(file.size>3*1024*1024)throw Error('A imagem deve ter no máximo 3 MB.');
 const ext={'image/jpeg':'jpg','image/png':'png','image/webp':'webp'}[file.type];
 const path='comando/'+crypto.randomUUID()+'.'+ext;
 const response=await fetch(base+'/storage/v1/object/fotos-comando/'+path,{method:'POST',headers:{apikey:cfg.supabaseAnonKey,Authorization:'Bearer '+session.access_token,'Content-Type':file.type,'x-upsert':'false'},body:file});
 if(!response.ok){let msg='Erro ao enviar fotografia';try{const d=await response.json();msg=d.message||d.error||msg}catch(e){}throw Error(msg)}
 return base+'/storage/v1/object/public/fotos-comando/'+path;
}
async function saveAdmin(ev,kind){
 ev.preventDefault();const form=ev.target,fd=new FormData(form),data={};
 for(const [k,v] of fd.entries())if(k!=='photo_file'&&k!=='remove_photo')data[k]=String(v).trim();
 if(Object.values(data).some(v=>!v)){alert('Preencha todos os campos.');return}
 const submit=form.querySelector('[type=submit]');if(submit)submit.disabled=true;
 try{
  const previous=editId?state[kind].find(x=>x.id===editId):null;
  if(kind==='people'){
   data.photo_url=previous?.photo_url||'';
   if(fd.get('remove_photo')==='yes')data.photo_url='';
   const photo=fd.get('photo_file');if(photo instanceof File&&photo.size)data.photo_url=await uploadCommanderPhoto(photo);
  }
  if(editId){const idx=state[kind].findIndex(x=>x.id===editId);if(idx>=0)state[kind][idx]={...data,id:editId}}
  else state[kind].push({...data,id:idgen()});
  if(await saveState()){editId=null;render()}
 }catch(e){alert('Não foi possível salvar: '+e.message)}finally{if(submit)submit.disabled=false}
}

/* CONEXÃO OPCIONAL COM SUPABASE: configuração pública em config.js;
   privilégios são validados pelo banco (RLS), nunca pelo JavaScript. */
const cfg=window.LOMITA_CONFIG||{};
const cloudMode=Boolean(cfg.supabaseUrl&&cfg.supabaseAnonKey);
let isAdmin=false,adminRole='',adminEmail='',session=null,serverVersion=0,cloudLoaded=false;
const base=String(cfg.supabaseUrl||'').replace(/\/$/,'');
const publicHeaders=()=>({'apikey':cfg.supabaseAnonKey,'Content-Type':'application/json'});
async function api(path,opts={},protectedCall=false){
  const headers={...publicHeaders(),...opts.headers};
  if(protectedCall){if(!session?.access_token)throw Error('Sessão encerrada. Faça login novamente.');headers.Authorization='Bearer '+session.access_token}
  else headers.Authorization='Bearer '+cfg.supabaseAnonKey;
  const response=await fetch(base+path,{...opts,headers});
  if(!response.ok){let msg='Erro HTTP '+response.status;try{const d=await response.json();msg=d.message||d.msg||d.error_description||d.error||msg}catch(e){}throw Error(msg)}
  if(response.status===204)return null;
  const t=await response.text();return t?JSON.parse(t):null;
}
function authPage(){return heading('ÁREA RESTRITA','Acesso exclusivo ao General Federal e membros autorizados do Alto Comando')+wrap(`<section class="auth-box"><h3>ACESSO ADMINISTRATIVO</h3><p class="muted">Entre com o e-mail e a senha cadastrados pela administração.</p><form class="admin-form" onsubmit="loginAdmin(event)"><label>E-mail<input type="email" name="email" autocomplete="username" required></label><label>Senha<input type="password" name="password" autocomplete="current-password" required></label><button class="admin-action" type="submit">ENTRAR NO PAINEL</button></form><p class="auth-error" id="login-error" role="alert"></p><p class="admin-hint">Sem cadastro público. Contas e permissões são liberadas pelo responsável pelo projeto.</p></section>`)}
async function loginAdmin(ev){
  ev.preventDefault();const f=ev.target,err=document.getElementById('login-error');err.textContent='Verificando acesso...';
  try{
    const x=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:f.email.value.trim(),password:f.password.value})});
    if(!x?.access_token)throw Error('Não foi possível autenticar.');
    session=x;const rows=await api('/rest/v1/portal_admins?select=role&user_id=eq.'+encodeURIComponent(x.user.id),{},true);
    if(!rows?.length){session=null;throw Error('Esta conta não está autorizada pelo Alto Comando.')}
    adminRole=rows[0].role;if(!['general_federal','alto_comando','comando_norte'].includes(adminRole))throw Error('Perfil não autorizado.');isAdmin=true;adminEmail=x.user.email||f.email.value.trim();
    // Guarda a sessão só nesta aba; ao fechar o navegador pode ser necessário entrar novamente.
    sessionStorage.setItem('lomita_session',JSON.stringify({token:x,at:Date.now()}));render();
  }catch(e){session=null;isAdmin=false;adminRole='';err.textContent=e.message}
}
async function logoutAdmin(){
  if(session?.access_token){try{await api('/auth/v1/logout',{method:'POST'},true)}catch(e){}}
  session=null;isAdmin=false;adminRole='';adminEmail='';sessionStorage.removeItem('lomita_session');render();
}
async function loadCloud(){
  if(!cloudMode)return;
  try{
    const rows=await api('/rest/v1/portal_content?select=data,version&id=eq.1');
    if(!rows?.length)throw Error('O banco ainda não foi configurado. Execute o SQL das instruções.');
    const d=rows[0].data;
    if(!d||!Array.isArray(d.notices)||!Array.isArray(d.events)||!Array.isArray(d.people)||typeof d.sections!=='object')throw Error('Dados inválidos no banco.');
    state=d;serverVersion=rows[0].version;cloudLoaded=true;render();
  }catch(e){
    cloudLoaded=false;document.getElementById('app').innerHTML=heading('CONEXÃO INDISPONÍVEL','O portal não conseguiu carregar os dados')+wrap(`<div class="admin-note">${esc(e.message)}. Confira config.js e a configuração do banco de dados.</div>`);
  }
}
async function restoreSession(){
  if(!cloudMode)return;
  try{
    const saved=JSON.parse(sessionStorage.getItem('lomita_session')||'null');
    if(!saved?.token?.access_token)return;
    // tokens expiram; não tentar manter sessão sem validação
    if(Date.now()-saved.at>Math.max(0,(saved.token.expires_in||3600)-90)*1000){sessionStorage.removeItem('lomita_session');return}
    session=saved.token;
    const rows=await api('/rest/v1/portal_admins?select=role&user_id=eq.'+encodeURIComponent(session.user.id),{},true);
    if(rows?.length&&['general_federal','alto_comando','comando_norte'].includes(rows[0].role)){isAdmin=true;adminRole=rows[0].role;adminEmail=session.user.email||''}else{session=null;sessionStorage.removeItem('lomita_session')}
  }catch(e){session=null;isAdmin=false;adminRole='';sessionStorage.removeItem('lomita_session')}
}

const efetivoSorted=()=>efetivoRecords.slice().sort((a,b)=>ordemPatente(a.patente)-ordemPatente(b.patente)||String(a.nome_militar).localeCompare(String(b.nome_militar),'pt-BR'));
// Filtros públicos: aplicados apenas à visualização, sem modificar o banco.
let efetivoBusca='',efetivoFiltroPatente='',efetivoFiltroSituacao='';
const textoBusca=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR');
function filtrarEfetivo(){
 const busca=document.getElementById('efetivo-busca');
 const patente=document.getElementById('efetivo-patente');
 const situacao=document.getElementById('efetivo-situacao');
 if(busca)efetivoBusca=busca.value;
 if(patente)efetivoFiltroPatente=patente.value;
 if(situacao)efetivoFiltroSituacao=situacao.value;
 const visiveis=efetivoSorted().filter(p=>textoBusca(p.nome_militar).includes(textoBusca(efetivoBusca))&&(!efetivoFiltroPatente||patenteNormalizada(p.patente)===efetivoFiltroPatente)&&(!efetivoFiltroSituacao||situacaoAtual(p)===efetivoFiltroSituacao));
 const corpo=document.getElementById('efetivo-tbody');
 const contador=document.getElementById('efetivo-contador');
 if(corpo)corpo.innerHTML=visiveis.map(p=>`<tr><td>${esc(p.nome_militar)}</td><td>${esc(p.patente)}</td><td>${esc(p.cargo||'—')}</td><td>${esc(detalheFerias(p))}</td></tr>`).join('')||'<tr><td colspan="4">Nenhum militar encontrado com os filtros selecionados.</td></tr>';
 if(contador)contador.textContent=`Exibindo ${visiveis.length} de ${efetivoRecords.length} militar(es)`;
}
function limparFiltrosEfetivo(){
 efetivoBusca='';efetivoFiltroPatente='';efetivoFiltroSituacao='';
 for(const id of ['efetivo-busca','efetivo-patente','efetivo-situacao']){const el=document.getElementById(id);if(el)el.value=''}
 filtrarEfetivo();
}
// Indicadores calculados a partir dos dados públicos já carregados.
function indicadoresEfetivo(){
 const total=efetivoRecords.length;
 const contagem=s=>efetivoRecords.filter(p=>situacaoAtual(p)===s).length;
 const dados=[['TOTAL',total],['ATIVOS',contagem('Ativo')],['AFASTADOS',contagem('Afastado')],['FÉRIAS',contagem('Férias')]];
 return `<div class="efetivo-indicadores">${dados.map(([rotulo,valor])=>`<div class="efetivo-indicador"><span>${rotulo}</span><strong>${valor}</strong></div>`).join('')}</div>`;
}
function distribuicaoPatentes(){
 const grupos=new Map();
 for(const p of efetivoRecords){const chave=patenteNormalizada(p.patente);if(!grupos.has(chave))grupos.set(chave,{patente:p.patente,total:0});grupos.get(chave).total++}
 const lista=[...grupos.values()].sort((a,b)=>ordemPatente(a.patente)-ordemPatente(b.patente)||a.patente.localeCompare(b.patente,'pt-BR'));
 return `<section class="panel" style="margin-top:16px"><h3>DISTRIBUIÇÃO POR PATENTE</h3>${lista.length?`<div class="efetivo-distribuicao">${lista.map(g=>`<div class="efetivo-grupo"><span>${esc(g.patente)}</span><strong>${g.total}</strong></div>`).join('')}</div>`:'<p class="muted">Nenhuma patente cadastrada.</p>'}</section>`;
}
function exportarEfetivoCSV(){
 if(!efetivoLoaded||efetivoError)return;
 const linhas=[['Nome militar','Patente','Função','Situação'],...efetivoSorted().map(p=>[p.nome_militar,p.patente,p.cargo||'',detalheFerias(p)])];
 const celula=v=>'"'+String(v??'').replace(/^[=+@\-\t\r]/, "'" ).replace(/"/g,'""')+'"';
 const csv='\uFEFF'+linhas.map(l=>l.map(celula).join(';')).join('\r\n');
 const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));
 const a=document.createElement('a');a.href=url;a.download='efetivo-setor-norte.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function efetivoPublicPage(){
 const status=efetivoError?`<div class="admin-note">${esc(efetivoError)}</div>`:!efetivoLoaded?'<p class="muted">Carregando efetivo...</p>':'';
 const patentesDisponiveis=[...new Map(efetivoRecords.map(p=>[patenteNormalizada(p.patente),p.patente])).entries()].filter(([k])=>k).sort((a,b)=>ordemPatente(a[1])-ordemPatente(b[1]));
 const options=patentesDisponiveis.map(([k,v])=>`<option value="${esc(k)}" ${efetivoFiltroPatente===k?'selected':''}>${esc(v)}</option>`).join('');
 const filtros=`<div class="efetivo-filtros"><label>Pesquisar por nome<input id="efetivo-busca" type="search" placeholder="Digite o nome militar..." value="${esc(efetivoBusca)}" oninput="filtrarEfetivo()"></label><label>Patente<select id="efetivo-patente" onchange="filtrarEfetivo()"><option value="">Todas as patentes</option>${options}</select></label><label>Situação<select id="efetivo-situacao" onchange="filtrarEfetivo()"><option value="">Todas as situações</option>${efetivoSituacoes.map(v=>`<option value="${v}" ${efetivoFiltroSituacao===v?'selected':''}>${v}</option>`).join('')}</select></label><button class="efetivo-limpar" type="button" onclick="limparFiltrosEfetivo()">LIMPAR FILTROS</button></div>`;
 const html=heading('CONTROLE DE EFETIVO','Relação de militares do Setor Norte')+wrap(`<section class="panel"><h3>EFETIVO DO SETOR NORTE</h3><p class="muted">Consulta pública dos militares do Setor Norte. Não são utilizadas fotografias. O cadastro e as alterações exigem login autorizado.</p>${status+(efetivoLoaded?`${indicadoresEfetivo()}${filtros}<div class="efetivo-exportar"><button type="button" onclick="exportarEfetivoCSV()">↓ EXPORTAR EFETIVO (CSV)</button></div><p id="efetivo-contador" class="admin-hint" aria-live="polite"></p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;text-align:left"><thead><tr><th>Nome militar</th><th>Patente</th><th>Função</th><th>Situação</th></tr></thead><tbody id="efetivo-tbody"></tbody></table></div>`:'')}</section>${efetivoLoaded?distribuicaoPatentes():''}`);
 return html;
}
function atualizarFiltrosEfetivo(){if(efetivoLoaded&&document.getElementById('efetivo-tbody'))filtrarEfetivo()}

function norteAdminPage(){
 return heading('PAINEL — COMANDO NORTE','Acesso restrito ao Controle de Efetivo')+wrap(`<div class="admin-note"><b>Conta do Comando Norte.</b> Gerenciamento do efetivo do setor. ${esc(adminEmail)} · <button class="admin-action" onclick="logoutAdmin()">SAIR</button></div><section class="panel">${efetivoAdminContent()}</section>`);
}
function efetivoAdminContent(){
 if(!cloudMode)return '<div class="admin-note">Conecte o Supabase para gerenciar o efetivo.</div>';
 if(!isAdmin)return '<div class="admin-note">Faça login para gerenciar o efetivo.</div>';
 const obj=efetivoEditId?efetivoRecords.find(x=>x.id===efetivoEditId):null;
 const entries=efetivoSorted().map(p=>`<div class="admin-row"><div><b>${esc(p.nome_militar)}</b><small>${esc(p.patente)} · ${esc(p.cargo||'Sem função')} · ${esc(detalheFerias(p))}</small></div><button onclick="editEfetivo('${esc(p.id)}')">EDITAR</button><button onclick="deleteEfetivo('${esc(p.id)}')">EXCLUIR</button></div>`).join('');
 const select=efetivoSituacoes.map(v=>`<option value="${v}" ${obj?.situacao===v?'selected':''}>${v}</option>`).join('');
 return `<h3>CONTROLE DE EFETIVO — SETOR NORTE</h3><p class="muted">Cadastre e atualize militares do setor. Sem fotografias.</p>${efetivoError?`<div class="admin-note">${esc(efetivoError)}</div>`:''}<div class="admin-pill">${efetivoRecords.length} militar(es)</div><div style="margin-top:14px">${efetivoLoaded?(entries||'<div class="admin-empty">Nenhum militar cadastrado.</div>'):'<p class="muted">Carregando dados...</p>'}</div><h3 style="margin-top:22px">${obj?'EDITAR MILITAR':'CADASTRAR MILITAR'}</h3><form class="admin-form" onsubmit="saveEfetivo(event)"><label>Nome militar<input name="nome_militar" required maxlength="120" value="${esc(obj?.nome_militar||'')}"></label><label>Patente<input name="patente" required maxlength="100" value="${esc(obj?.patente||'')}"></label><label>Cargo / função<input name="cargo" maxlength="160" value="${esc(obj?.cargo||'')}"></label><label>Situação<select name="situacao" onchange="alternarCamposFerias(this.form)">${select}</select></label><div id="campos-ferias" class="admin-form" style="${obj?.situacao==='Férias'?'':'display:none'}"><label>Início das férias<input type="date" name="ferias_inicio" value="${esc(obj?.ferias_inicio||diaLocal())}"></label><label>Quantidade de dias de férias<input type="number" min="1" max="365" name="ferias_dias" value="${esc(obj?.ferias_dias||'')}" placeholder="Ex.: 15"></label><p class="admin-hint">A contagem começa na data de início. O retorno é no dia seguinte ao último dia de férias.</p></div><div class="admin-toolbar"><button type="submit">${obj?'SALVAR ALTERAÇÕES':'CADASTRAR MILITAR'}</button>${obj?'<button type="button" onclick="efetivoEditId=null;render()">CANCELAR</button>':''}</div></form>`;
}
function alternarCamposFerias(f){const ativo=f.elements.situacao.value==='Férias';const area=f.querySelector('#campos-ferias');if(area)area.style.display=ativo?'grid':'none';for(const nome of ['ferias_inicio','ferias_dias'])f.elements[nome].required=ativo}
async function loadEfetivo(){
 if(!cloudMode)return;
 try{
  const rows=await api('/rest/v1/efetivo_norte?select=id,nome_militar,patente,cargo,situacao,ferias_inicio,ferias_dias&order=nome_militar.asc',{},Boolean(isAdmin&&session?.access_token));
  efetivoRecords=Array.isArray(rows)?rows:[];efetivoError='';efetivoLoaded=true;
 }catch(e){efetivoError='Não foi possível carregar o efetivo: '+e.message;efetivoLoaded=false}
 const p=decodeURIComponent(location.hash.slice(1));
 if(p==='efetivo'){document.getElementById('app').innerHTML=efetivoPublicPage();atualizarFiltrosEfetivo();}
 else if(p==='admin'&&(adminRole==='comando_norte'||adminTab==='efetivo_norte'))document.getElementById('app').innerHTML=adminPage();
}
function editEfetivo(id){efetivoEditId=id;render()}
async function saveEfetivo(ev){
 ev.preventDefault();if(!isAdmin||!cloudMode)return;
 const f=ev.target,fd=new FormData(f),data={nome_militar:String(fd.get('nome_militar')||'').trim(),patente:String(fd.get('patente')||'').trim(),cargo:String(fd.get('cargo')||'').trim(),situacao:String(fd.get('situacao')||'')};
 if(!data.nome_militar||!data.patente||!efetivoSituacoes.includes(data.situacao))return alert('Confira os campos.');
 if(data.situacao==='Férias'){data.ferias_inicio=String(fd.get('ferias_inicio')||'');data.ferias_dias=Number(fd.get('ferias_dias'));if(!/^\d{4}-\d{2}-\d{2}$/.test(data.ferias_inicio)||!Number.isInteger(data.ferias_dias)||data.ferias_dias<1||data.ferias_dias>365)return alert('Informe a data de início e a quantidade de dias (1 a 365).')}else{data.ferias_inicio=null;data.ferias_dias=null}
 const submit=f.querySelector('[type=submit]');submit.disabled=true;
 try{
  if(efetivoEditId)await api('/rest/v1/efetivo_norte?id=eq.'+encodeURIComponent(efetivoEditId),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(data)},true);
  else await api('/rest/v1/efetivo_norte',{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(data)},true);
  efetivoEditId=null;await loadEfetivo();alert('Registro salvo com sucesso.');
 }catch(e){alert('Não foi possível salvar: '+e.message)}finally{submit.disabled=false}
}
async function deleteEfetivo(id){
 if(!isAdmin||!cloudMode||!confirm('Excluir este militar do efetivo?'))return;
 try{await api('/rest/v1/efetivo_norte?id=eq.'+encodeURIComponent(id),{method:'DELETE'},true);efetivoEditId=null;await loadEfetivo()}
 catch(e){alert('Não foi possível excluir: '+e.message)}
}


/* Atualização isolada da página inicial; mantém as demais rotas e permissões. */
const contentAntesDaHome=content;
function eventosIniciais(){
 const hoje=diaLocal();
 const futuros=(Array.isArray(state.events)?state.events:[]).filter(e=>e.date&&e.date>=hoje).slice().sort((a,b)=>(a.date+' '+(a.time||'')).localeCompare(b.date+' '+(b.time||''))).slice(0,3);
 return futuros.length?futuros.map(e=>`<div class="newsitem"><span class="newsicon">◷</span><div><b>${esc(e.title||'Atividade')}</b><p>${dateBR(e.date)}${e.time?' · '+esc(e.time):''}</p></div></div>`).join(''):'<p class="home-empty">Nenhuma atividade futura publicada no momento.</p>';
}
function homeAtualizada(){
 return `<section class="hero"><div class="heroInner"><span class="tag">PORTAL INSTITUCIONAL · ONESTATE RP</span><h1>FORÇA.<br>DISCIPLINA.<br><em>UNIÃO.</em></h1><p>Bem-vindo ao Exército de Lomita — Setor Norte. Informações oficiais, formação militar e serviços do setor em um só lugar.</p><button class="goldbtn" onclick="go('estudos')">ACESSAR CENTRAL DE ESTUDOS <span>➜</span></button></div></section>`+
 wrap(`<div class="home-intro"><h2>ACESSO RÁPIDO</h2><p>Escolha uma área para continuar.</p></div><div class="quick home-quick">${button('estudos','Central de Estudos','Manuais e regras','▦')}${button('efetivo','Controle de Efetivo','Consulta de militares','♙')}${button('comunicados','Comunicados','Avisos oficiais','▧')}${button('central','Central do Recruta','Formação inicial','♜')}${button('cronograma','Cronograma','Eventos e atividades','◷')}${button('comando','Alto Comando','Hierarquia e liderança','♛')}</div><div class="bottomgrid home-news"><section class="panel"><span class="home-kicker">INFORMAÇÃO OFICIAL</span><h3>ÚLTIMOS COMUNICADOS</h3>${newsMarkup()}<button class="goldbtn" onclick="go('comunicados')">VER TODOS <span>➜</span></button></section><section class="panel"><span class="home-kicker">AGENDA DO SETOR</span><h3>PRÓXIMAS ATIVIDADES</h3>${eventosIniciais()}<button class="goldbtn" onclick="go('cronograma')">VER CRONOGRAMA <span>➜</span></button></section></div><section class="home-feature"><span class="home-kicker">SETOR NORTE · FORMAÇÃO</span><h3>PREPARAÇÃO E DISCIPLINA</h3><p>Consulte os manuais de ronda, blitz, viaturas, conduta e comunicação na Central de Estudos.</p><button class="goldbtn" onclick="go('estudos')">EXPLORAR OS MANUAIS <span>➜</span></button></section>`)+appendSection('inicio');
}
content=function(p){return p==='inicio'?homeAtualizada():contentAntesDaHome(p)};

setInterval(()=>{if(efetivoLoaded&&location.hash==='#efetivo'){document.getElementById('app').innerHTML=efetivoPublicPage();atualizarFiltrosEfetivo()}},60000);
if(cloudMode){
  // Em modo conectado não exibe dados locais como se fossem publicados.
  document.getElementById('app').innerHTML=heading('CARREGANDO PORTAL','Consultando informações oficiais')+wrap('<p class="muted">Aguarde...</p>');
  (async()=>{await restoreSession();await loadCloud()})();
}else{render()}

</script></body></html>
